<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Knowledge Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f7f7f8;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    #chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 85%;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #2563eb; color: white; }
    .bot { align-self: flex-start; background: white; border: 1px solid #ddd; }
    .bot.not-found { border-color: #e11d48; color: #b91c1c; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Product Knowledge Assistant</h1>
  <div id="chat"></div>
  <form id="ask-form">
    <input id="question" type="text" placeholder="Ask about a product..." autocomplete="off" />
    <button type="submit">Ask</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');

    function addMessage(text, sender, notFound) {
      const div = document.createElement('div');
      div.className = 'msg ' + sender + (notFound ? ' not-found' : '');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, 'user');
      input.value = '';
      form.querySelector('button').disabled = true;

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        addMessage(data.answer, 'bot', !data.found);
      } catch (err) {
        addMessage('Something went wrong talking to the server.', 'bot', true);
      } finally {
        form.querySelector('button').disabled = false;
      }
    });
  </script>
</body>
</html>
